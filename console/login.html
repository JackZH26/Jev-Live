<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>JEV · Private console</title><style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3f0e8;background:#0d0f12}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 20% 10%,#282522,transparent 65%),#0d0f12;padding:24px}main{width:min(100%,390px)}.mark{width:46px;height:46px;border:1px solid #ff604b;display:grid;place-items:center;color:#ff604b;font-size:24px;transform:rotate(45deg);margin:0 0 40px 10px}.mark span{transform:rotate(-45deg)}small{color:#8b9ca9;letter-spacing:3px;font-size:11px}h1{font-size:36px;letter-spacing:-1.5px;margin:13px 0}p{color:#96a6b3;line-height:1.8;font-size:14px}label{display:block;font-size:12px;margin:30px 0 10px}input,button{width:100%;border-radius:6px;padding:15px;font:inherit}input{background:#171b20;color:#f3f0e8;border:1px solid #394955;outline:none}input:focus{border-color:#ff604b}button{background:#ff604b;color:white;border:0;margin-top:16px;font-weight:650;cursor:pointer}button:disabled{opacity:.5}footer{margin-top:40px;border-top:1px solid #2a3742;padding-top:18px;font-size:11px;color:#758692;display:flex;justify-content:space-between}select{border:0;background:#0d0f12;color:#96a6b3}#error{min-height:22px;color:#ff7782;font-size:13px}</style>
<main><div class="mark"><span>J</span></div><small>ENTER THE CUBE / JEV</small><h1 id="title">私密控制台</h1><p id="desc">查看实时决策、执行轨迹与比赛验收。<br>请输入访问密码。</p><form><label id="label" for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit">进入控制台 →</button><p id="error" role="alert"></p></form><footer><span>PRIVATE · READ ONLY</span><select aria-label="Language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></footer></main><script>
const words={'zh-CN':['私密控制台','查看实时决策、执行轨迹与比赛验收。请输入访问密码。','访问密码','进入控制台 →','密码不正确，请重试。','尝试次数过多，请稍后再试。','连接失败，请重试。'],'zh-TW':['私密控制台','查看即時決策、執行軌跡與比賽驗收。請輸入存取密碼。','存取密碼','進入控制台 →','密碼不正確，請重試。','嘗試次數過多，請稍後再試。','連線失敗，請重試。'],en:['Private console','Live decisions, execution traces and match acceptance. Enter your access password.','Access password','Open console →','Incorrect password. Try again.','Too many attempts. Try again later.','Connection failed. Try again.'],ja:['プライベートコンソール','リアルタイムの判断、実行経路、試合結果を確認します。パスワードを入力してください。','アクセスパスワード','コンソールを開く →','パスワードが違います。','しばらくしてから再試行してください。','接続できません。再試行してください。'],ko:['비공개 콘솔','실시간 판단, 실행 경로, 경기 결과를 확인합니다. 비밀번호를 입력하세요.','접속 비밀번호','콘솔 열기 →','비밀번호가 올바르지 않습니다.','잠시 후 다시 시도하세요.','연결하지 못했습니다. 다시 시도하세요.']};let lang=localStorage.getItem('jev.console.language')||'zh-CN';if(!words[lang])lang='en';const select=document.querySelector('select');function apply(){const w=words[lang];['title','desc','label','submit'].forEach((id,i)=>document.getElementById(id).textContent=w[i]);document.documentElement.lang=lang;select.value=lang;localStorage.setItem('jev.console.language',lang)}select.onchange=()=>{lang=select.value;apply()};apply();document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;document.getElementById('error').textContent='';try{const r=await fetch('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.ok)location.replace('./');else document.getElementById('error').textContent=words[lang][r.status===429?5:4]}catch{document.getElementById('error').textContent=words[lang][6]}finally{b.disabled=false}};
</script></html>
