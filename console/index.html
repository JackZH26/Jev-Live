function render(packet){const d=packet?.state;const age=d?Math.max(0,Math.round((Date.now()-d.updatedAt)/1000)):Infinity;const live=age<10;$('signal').classList.toggle('online',live);text('connection',d?(live?t('online'):t('offline')):t('waiting'));text('updated',Number.isFinite(age)?age+' '+t('secondsAgo'):'—');text('version',d?.candidate||'');if(!d)return;const s=d.self||{},e=d.executor||{},c=d.cloud||{},m=d.metrics||{};text('streak',d.streak?.streak??0);text('health',Number.isFinite(s.health)?Math.round(s.health):'—');text('healthMax','/ '+(s.maxHealth||100));text('phase',d.phase||'—');text('latency',Number.isFinite(c.lastMs)?Math.round(c.lastMs):'—');text('shots',m.shots??0);text('kills',(s.kills??0)+' '+t('kills'));text('room',s.room);text('objective',action(e.objective));text('feedback',[e.status,e.reason].filter(Boolean).join(' · '));text('cloudAction',action(c.candidate));text('arbitration',c.candidate&&c.candidate===e.objective?t('accepted'):t('overridden'));text('executor',e.status||'—');text('enemies',(d.enemies||[]).length);text('weapon',(s.weapon||'—').replace(/^ID_ETC_/,'').replace(/_C$/,''));text('ammo',(s.magazine??'—')+' / '+(s.reserve??'—'));text('explanation',(s.danger?t('danger'):s.health<70?t('hurt'):(d.enemies||[]).length===0?t('noEnemies'):'')+' '+t('explain'));if(d.frame&&/^[A-Za-z0-9+/=]+$/.test(d.frame)){$('frame').src='data:image/jpeg;base64,'+d.frame;$('preview').classList.remove('no-frame')}plotRoute(d.route);const list=$('timeline');list.replaceChildren();for(const row of (d.timeline||[]).slice(-8).reverse()){const item=document.createElement('div');item.className='event';const time=document.createElement('time');time.textContent=new Date(row.at).toLocaleTimeString(lang,{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});const dot=document.createElement('i'),name=document.createElement('span'),detail=document.createElement('small');name.textContent=action(row.action);detail.textContent=row.ms?Math.round(row.ms)+' ms':row.status||'';item.append(time,dot,name,detail);list.append(item)}if(!list.childNodes.length){const p=document.createElement('p');p.className='empty';p.textContent=t('waiting');list.append(p)}text('requests',(c.requests??0)+' '+t('requests'));const chart=$('latencyChart');chart.replaceChildren();const values=(c.latencies||[]).filter(Number.isFinite).slice(-40),max=Math.max(1200,...values);chart.append(svg('line',{x1:0,y1:59,x2:700,y2:59,stroke:'#353b44','stroke-width':1}));if(values.length>1)chart.append(svg('polyline',{points:values.map((v,i)=>[i*700/(values.length-1),56-v/max*50].join(',')).join(' '),fill:'none',stroke:'#ff604b','stroke-width':2,'stroke-linejoin':'round'}))}
async function refresh(){try{const r=await fetch('state',{cache:'no-store'});if(r.status===401){location.reload();return}if(!r.ok)throw Error();latest=await r.json();render(latest)}catch{$('signal').classList.remove('online');text('connection',t('offline'))}finally{setTimeout(refresh,2000)}}apply();refresh();
